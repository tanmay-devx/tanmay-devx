name: Sync GitHub 3D Activity

on:
  schedule:
    # Sync every 6 hours automatically
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_activity.py"
      - ".github/workflows/update-activity.yml"

permissions:
  contents: write

jobs:
  sync-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live 3D activity SVG
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: tanmay-devx
          ACTIVITY_SVG_PATH: assets/activity.svg
        run: python3 scripts/generate_activity.py

      - name: Commit updated activity.svg if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          if git diff --cached --quiet; then
            echo "No changes to assets/activity.svg."
          else
            git commit -m "chore: sync 3D GitHub activity graph [skip ci]"
            git push
          fi

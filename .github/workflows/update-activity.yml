name: Sync GitHub 3D Activity & Profile Stats

on:
  schedule:
    # Real-time automated sync every 30 minutes
    - cron: "0,30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-stats, git-push, ping]
  push:
    branches:
      - main

concurrency:
  group: stats-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live 3D activity and stats SVGs
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: tanmay-devx
          LEETCODE_USERNAME: tanmay041
          ACTIVITY_SVG_PATH: assets/activity.svg
          ASSETS_DIR: assets
        run: |
          python3 scripts/generate_activity.py
          python3 scripts/sync_stats_cards.py

      - name: Publish synced SVGs to stats-output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/stats-out/assets
          cp assets/activity.svg assets/card-leetcode.svg assets/card-languages.svg assets/card-streak.svg assets/card-github.svg /tmp/stats-out/assets/
          cd /tmp/stats-out
          git init -b stats-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: real-time sync GitHub, LeetCode & profile stats [skip ci]"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" stats-output

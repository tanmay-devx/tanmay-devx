<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" width="100%" height="100%">
<defs>
  <style>
    .heading { font-family: Georgia, "Times New Roman", serif; font-size: 29px; fill: #F0F6FC; font-weight: normal; letter-spacing: -0.2px; }
    .flow-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #39D353; font-weight: 500; letter-spacing: 0.5px; }
    .layer-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .tech-stack { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 500; }
    .applied-lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 1.2px; }
    .applied-lbl-active { fill: #7EE787; }
    .applied-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: 400; }

    @keyframes layerActive {
      0%   { opacity: 0; }
      3%   { opacity: 1; }
      12%  { opacity: 1; }
      18%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes spineTrace {
      0%, 9%       { stroke-dashoffset: 405; opacity: 1; }
      16.67%, 25.67% { stroke-dashoffset: 324; opacity: 1; }
      33.33%, 42.33% { stroke-dashoffset: 243; opacity: 1; }
      50%, 59%     { stroke-dashoffset: 162; opacity: 1; }
      66.67%, 75.67% { stroke-dashoffset: 81; opacity: 1; }
      83.33%, 92%  { stroke-dashoffset: 0; opacity: 1; }
      96%          { stroke-dashoffset: 0; opacity: 0; }
      97%          { stroke-dashoffset: 405; opacity: 0; }
      100%         { stroke-dashoffset: 405; opacity: 1; }
    }

    @keyframes packetFlow {
      0%, 9%       { transform: translateY(0px); opacity: 1; }
      16.67%, 25.67% { transform: translateY(81px); opacity: 1; }
      33.33%, 42.33% { transform: translateY(162px); opacity: 1; }
      50%, 59%     { transform: translateY(243px); opacity: 1; }
      66.67%, 75.67% { transform: translateY(324px); opacity: 1; }
      83.33%, 92%  { transform: translateY(405px); opacity: 1; }
      96%          { transform: translateY(405px); opacity: 0; }
      97%          { transform: translateY(0px); opacity: 0; }
      100%         { transform: translateY(0px); opacity: 1; }
    }

    @keyframes flowTagPulse {
      0%, 100% { opacity: 0.75; }
      50%      { opacity: 1; }
    }

    .layer-active { animation: layerActive 9s infinite linear; }
    .l1 { animation-delay: -0.27s; }
    .l2 { animation-delay: -7.77s; }
    .l3 { animation-delay: -6.27s; }
    .l4 { animation-delay: -4.77s; }
    .l5 { animation-delay: -3.27s; }
    .l6 { animation-delay: -1.77s; }

    .spine-active {
      stroke-dasharray: 405;
      stroke-dashoffset: 405;
      animation: spineTrace 9s infinite ease-in-out;
    }

    .packet-dot {
      animation: packetFlow 9s infinite ease-in-out;
    }

    .flow-pulse {
      animation: flowTagPulse 3s infinite ease-in-out;
    }
  </style>
  <filter id="greenCardGlow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#39D353" flood-opacity="0.35"/>
  </filter>
  <filter id="packetGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#39D353" flood-opacity="0.85"/>
  </filter>
</defs>

<rect width="1040" height="590" fill="#0D1117" rx="12"/>
<text x="40" y="48" class="heading">One engineer, every layer of a distributed system</text>
<text x="1000" y="46" class="flow-tag flow-pulse" text-anchor="end">&#x2193; request &#160;&#160;&#160; &#x2191; state</text>

<!-- Pipeline vertical track -->
<line x1="42" y1="120" x2="42" y2="525" stroke="#30363D" stroke-width="1.5"/>
<line x1="42" y1="120" x2="42" y2="525" stroke="#39D353" stroke-width="2" class="spine-active"/>

<!-- Base (inactive) layers -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 132" width="100%" height="100%">
<defs>
  <style>
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; }
    .title { font-family: "Segoe UI", Ubuntu, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #F0F6FC; }
    .sub { font-family: "Segoe UI", Ubuntu, -apple-system, sans-serif; font-size: 12.5px; font-weight: 400; fill: #9CA3AF; }
    .cta { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    @keyframes cardShimmer {
      0%   { transform: translateX(-220px); opacity: 0; }
      15%  { opacity: 0.32; }
      55%  { opacity: 0.32; }
      70%  { transform: translateX(1260px); opacity: 0; }
      100% { transform: translateX(1260px); opacity: 0; }
    }
    @keyframes borderPulse {
      0%, 100% { stroke-opacity: 0.35; }
      50%      { stroke-opacity: 0.85; }
    }
    .shimmer { animation: cardShimmer 7.5s infinite ease-in-out; animation-delay: -1.2s; }
    .pulse-border { animation: borderPulse 5s infinite ease-in-out; animation-delay: -1.2s; }
  </style>
  <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#A371F7" stop-opacity="0"/>
    <stop offset="50%" stop-color="#A371F7" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="cardClip">
    <rect x="1" y="1" width="1038" height="130" rx="9"/>
  </clipPath>
</defs>
<rect x="1" y="1" width="1038" height="130" rx="9" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
<rect x="1" y="1" width="1038" height="130" rx="9" fill="none" stroke="#A371F7" stroke-width="1.2" class="pulse-border"/>
<g clip-path="url(#cardClip)">
  <g transform="skewX(-18)">
    <rect x="0" y="0" width="180" height="132" fill="url(#shimmerGrad)" class="shimmer"/>
  </g>
</g>
<rect x="1" y="20" width="3" height="92" rx="1.5" fill="#A371F7"/>
<g transform="translate(26, 20)">
  <path d="M1 7.5 10 3l9 4.5-9 4.5L1 7.5Zm3.5 2v4.2c0 1.4 2.5 2.8 5.5 2.8s5.5-1.4 5.5-2.8V9.5" fill="none" stroke="#A371F7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="56" y="34" class="badge" fill="#A371F7">AWS ACADEMY GRADUATE · VERIFIED BADGE</text>
<text x="26" y="66" class="title">AWS Academy Graduate — Generative AI Foundations</text>
<text x="26" y="92" class="sub">Demonstrated proficiency in large language model architectures and cloud-hosted inference pipelines</text>
<text x="26" y="114" class="cta" fill="#A371F7">VERIFY CREDLY BADGE &#8594;</text>
</svg>

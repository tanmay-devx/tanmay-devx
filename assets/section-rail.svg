<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 12" width="100%" height="12">
<defs>
  <style>
    @keyframes railGlide {
      0%   { transform: translateX(-180px); opacity: 0; }
      15%  { opacity: 0.9; }
      85%  { opacity: 0.9; }
      100% { transform: translateX(1040px); opacity: 0; }
    }
    @keyframes nodeBreath {
      0%, 100% { opacity: 0.65; }
      50%      { opacity: 1; }
    }
    .rail-beam { animation: railGlide 7s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .rail-node { animation: nodeBreath 4s infinite ease-in-out; }
  </style>
  <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#39D353" stop-opacity="0"/>
    <stop offset="50%" stop-color="#39D353" stop-opacity="0.95"/>
    <stop offset="85%" stop-color="#58A6FF" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="railClip">
    <rect x="6" y="5" width="1028" height="2" rx="1"/>
  </clipPath>
</defs>
<line x1="6" y1="6" x2="1034" y2="6" stroke="#21262D" stroke-width="1"/>
<line x1="6" y1="6" x2="58" y2="6" stroke="#39D353" stroke-width="1.5" stroke-opacity="0.85"/>
<g clip-path="url(#railClip)">
  <rect x="0" y="5" width="180" height="2" fill="url(#railGrad)" class="rail-beam"/>
</g>
<circle cx="6" cy="6" r="2.5" fill="#39D353" class="rail-node"/>
<rect x="1031.5" y="3.5" width="5" height="5" rx="1" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
</svg>


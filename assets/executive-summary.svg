  <text x="556" y="156" class="card-stack" fill="#8B949E">Rootless Podman · Dropped Caps · Linux cgroups</text>
</g><g>
  <rect x="24" y="196" width="488" height="102" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <rect x="38" y="216" width="3" height="62" rx="1.5" fill="#26A641"/>
  <text x="52" y="227" class="card-tag" fill="#39D353">03&#160;&#160;DEFENSIVE ENGINEERING</text>
  <text x="52" y="251" class="card-desc" fill="#C9D1D9">Fault tolerance beyond superficial abstractions</text>
  <text x="52" y="274" class="card-stack" fill="#8B949E">Manual ACKs · Circuit Breakers · Bounded Streams</text>
</g><g>

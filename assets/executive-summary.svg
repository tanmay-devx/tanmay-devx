  <rect x="542" y="216" width="3" height="62" rx="1.5" fill="#26A641"/>
  <text x="556" y="227" class="card-tag" fill="#39D353">04&#160;&#160;CLOUD &amp; INFRASTRUCTURE</text>
  <text x="556" y="251" class="card-desc" fill="#C9D1D9">Reproducible, declarative production environments</text>
  <text x="556" y="274" class="card-stack" fill="#8B949E">AWS (EC2, S3, IAM, VPC) · Terraform · Docker</text>
</g>
